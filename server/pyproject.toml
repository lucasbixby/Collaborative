[project]
name = "collaborative-server"
version = "0.1.0"
description = "FastAPI relay and sync engine for Collaborative"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",  # the extra brings greenlet, which async SQLAlchemy needs
    "aiosqlite>=0.20",
    "PyJWT>=2.8",  # login tokens (#16)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",  # a hang fails the test instead of eating CI (#20)
    "httpx>=0.27",
    "ruff==0.17.1",  # pinned: an older local ruff missed rules CI's version catches (#11)
    "websockets>=13.0",  # scripts/ws_probe.py; otherwise only a transitive uvicorn[standard] dep
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30  # seconds per test, teardown included; pytest-timeout
# pytest resets warning filters per test, undoing app.auth.tokens' own filter; tests use the
# 18-byte default key.
filterwarnings = ["ignore::jwt.warnings.InsecureKeyLengthWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
