<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Scripts and styles only from the app itself; requests may go to any server, since the
         desktop app talks to whichever one is set in its settings. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src *; img-src 'self' data:; object-src 'none'; base-uri 'none'"
    />
    <title>Collaborative</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
