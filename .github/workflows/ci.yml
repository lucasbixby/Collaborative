name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  addon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon
    steps:
      - uses: actions/checkout@v4
      # bpy links against these X11/OpenGL libraries even when running headless.
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libx11-6 libxext6 libxrender1 libxfixes3 libxi6 libxkbcommon0 libxcb1
          libsm6 libice6 libgl1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: addon/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
